<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="레지오 보고">
<meta name="theme-color" content="#141f38">
<title>레지오 마리애 활동보고</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#141f38;--navy2:#1e2e50;--navy3:#253462;
  --gold:#c9a84c;--gold2:#e0bc6a;
  --cream:#f0ebe0;--cream2:#d4cfc4;
  --border:rgba(201,168,76,0.25);--card-bg:rgba(255,255,255,0.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--navy);color:var(--cream);min-height:100vh;}

/* LOADING */
#loading-screen{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:2rem;
  background:linear-gradient(160deg,#0a1225 0%,#141f38 55%,#1e2e50 100%);
}
.spinner{
  width:38px;height:38px;border:3px solid rgba(201,168,76,.2);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin .8s linear infinite;margin:1.2rem 0;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-msg{font-size:.82rem;color:var(--cream2);opacity:.7;text-align:center;}

/* LOGIN */
#login-screen{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:2rem;
  background:linear-gradient(160deg,#0a1225 0%,#141f38 55%,#1e2e50 100%);
}
.login-cross{font-size:2.8rem;color:var(--gold);margin-bottom:.4rem;}
.login-title{font-family:'Noto Serif KR',serif;font-size:1.9rem;color:var(--gold);margin-bottom:.3rem;}
.login-sub{font-size:.78rem;letter-spacing:.15em;color:var(--cream2);opacity:.65;margin-bottom:2.5rem;}
.login-card{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:18px;padding:2rem;width:100%;max-width:360px;}
.fg{margin-bottom:1.1rem;}
.fg label{display:block;font-size:.75rem;color:var(--gold);margin-bottom:.45rem;letter-spacing:.06em;}
.fg input,.fg select{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(201,168,76,.25);border-radius:9px;padding:.7rem 1rem;color:var(--cream);font-family:'Noto Sans KR',sans-serif;font-size:.92rem;transition:border-color .2s;}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--gold);}
.fg select option{background:var(--navy);}
.err{color:#e74c3c;font-size:.78rem;margin-top:.4rem;text-align:center;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.7rem 1.4rem;border-radius:9px;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:.88rem;font-weight:500;transition:all .18s;}
.btn-full{width:100%;}
.btn-primary{background:var(--gold);color:var(--navy);}
.btn-primary:hover{background:var(--gold2);}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid var(--border);}
.btn-ghost:hover{background:rgba(255,255,255,.13);}
.btn-red{background:rgba(192,57,43,.18);color:#e74c3c;border:1px solid rgba(192,57,43,.3);}
.btn-red:hover{background:rgba(192,57,43,.28);}
.btn-green{background:rgba(39,174,96,.18);color:#2ecc71;border:1px solid rgba(39,174,96,.3);}
.btn-green:hover{background:rgba(39,174,96,.28);}
.btn-blue{background:rgba(41,128,185,.18);color:#5dade2;border:1px solid rgba(41,128,185,.3);}
.btn-blue:hover{background:rgba(41,128,185,.28);}
.btn-sm{padding:.35rem .75rem;font-size:.78rem;border-radius:7px;}

/* APP SHELL */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:rgba(10,18,37,.95);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
.topbar-logo{font-family:'Noto Serif KR',serif;font-size:1.05rem;color:var(--gold);}
.topbar-user{font-size:.75rem;color:var(--cream2);opacity:.75;}
.content{flex:1;padding:1rem;padding-bottom:5.5rem;max-width:900px;margin:0 auto;width:100%;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(10,18,37,.97);border-top:1px solid var(--border);z-index:100;backdrop-filter:blur(12px);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.55rem .2rem;border:none;background:none;cursor:pointer;color:var(--cream2);opacity:.4;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.nav-btn.on{opacity:1;color:var(--gold);}
.nv-icon{font-size:1.15rem;}
.nv-lbl{font-size:.62rem;margin-top:2px;}

/* CARDS */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:13px;padding:1.2rem;margin-bottom:1rem;}
.card-head{font-family:'Noto Serif KR',serif;font-size:.95rem;color:var(--gold);margin-bottom:1rem;padding-bottom:.7rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}

/* NAV BAR */
.nav-bar{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:.65rem 1rem;}
.nav-bar button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:1.1rem;padding:.15rem .4rem;}
.nav-bar-label{flex:1;text-align:center;font-size:.82rem;color:var(--cream);line-height:1.4;}

/* SECTION TITLE */
.sec-title{font-family:'Noto Serif KR',serif;font-size:1.05rem;color:var(--gold);margin-bottom:1rem;}

/* BADGES */
.badge{display:inline-block;padding:.18rem .55rem;border-radius:20px;font-size:.68rem;font-weight:500;}
.b-단장{background:rgba(201,168,76,.18);color:var(--gold);border:1px solid rgba(201,168,76,.35);}
.b-부단장{background:rgba(100,149,237,.18);color:#6fa3ef;border:1px solid rgba(100,149,237,.35);}
.b-서기{background:rgba(144,238,144,.15);color:#7ddb7d;border:1px solid rgba(144,238,144,.3);}
.b-회계{background:rgba(255,165,0,.15);color:#ffb833;border:1px solid rgba(255,165,0,.3);}
.b-평단원{background:rgba(255,255,255,.08);color:#ccc;border:1px solid rgba(255,255,255,.18);}
.b-admin{background:rgba(192,57,43,.18);color:#e74c3c;border:1px solid rgba(192,57,43,.3);}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:.9rem;}
.search-inp{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.3);border-radius:9px;padding:.65rem 2.8rem .65rem 2.4rem;color:var(--cream);font-family:'Noto Sans KR',sans-serif;font-size:.9rem;transition:border-color .2s;}
.search-inp:focus{outline:none;border-color:var(--gold);}
.search-inp::placeholder{color:var(--cream2);opacity:.5;}
.s-icon{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.55;pointer-events:none;}
.s-clear{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--cream2);opacity:.6;cursor:pointer;font-size:1rem;display:none;}
.s-count{font-size:.75rem;color:var(--gold);opacity:.85;margin-bottom:.6rem;}
.no-result{text-align:center;padding:2rem 1rem;color:var(--cream2);opacity:.5;font-size:.88rem;}
.hl{background:rgba(201,168,76,.35);border-radius:3px;color:var(--gold2);padding:0 1px;}

/* ACT ITEM */
.act-item{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.05);}
.act-item:last-child{border-bottom:none;}
.act-item-name{flex:1;font-size:.85rem;line-height:1.45;}
.num-inp{width:56px;background:rgba(255,255,255,.09);border:1px solid rgba(201,168,76,.28);border-radius:5px;color:var(--cream);text-align:center;padding:.25rem .1rem;font-size:.82rem;font-family:'Noto Sans KR',sans-serif;}
.num-inp:focus{outline:none;border-color:var(--gold);}
/* 읽기 전용 숫자 표시 */
.num-display{
  min-width:40px;text-align:center;font-size:.88rem;
  color:var(--gold2);font-weight:500;
  padding:.2rem .3rem;
}
/* 편집 중 카드 강조 */
.editing-active .card{border-color:rgba(201,168,76,.45);}

/* REPORT TABLE */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.rtbl{width:100%;border-collapse:collapse;font-size:.8rem;white-space:nowrap;}
.rtbl th{background:rgba(201,168,76,.12);color:var(--gold);padding:.5rem .65rem;text-align:center;border:1px solid rgba(201,168,76,.18);font-weight:500;white-space:normal;word-break:keep-all;min-width:48px;line-height:1.35;}
.rtbl th.me-col{background:rgba(201,168,76,.22);color:var(--gold2);}
.rtbl td{padding:.42rem .65rem;border:1px solid rgba(255,255,255,.06);text-align:center;color:var(--cream);}
.rtbl tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.rtbl .cat-row td{background:rgba(201,168,76,.09);color:var(--gold2);font-weight:600;text-align:left;font-size:.75rem;letter-spacing:.03em;}
.rtbl .left-td{text-align:left;white-space:normal;min-width:140px;}
.rtbl .stk{position:sticky;left:0;background:#0f1e35;z-index:1;}
.rtbl .cat-row .stk{background:#1c2610;}
.rtbl tr:nth-child(even) .stk{background:#0d1b30;}
.rtbl .tot.stk{background:#142038 !important;}
.rtbl .tot{background:rgba(201,168,76,.1)!important;color:var(--gold2)!important;font-weight:600;}
.rtbl .att-sum-row td{background:rgba(39,174,96,.08)!important;color:#7ddb7d!important;font-weight:600;}
.rtbl .cat-tot{background:rgba(201,168,76,.18)!important;color:var(--gold2)!important;font-weight:700;}

/* ATTENDANCE */
.att-row-ui{display:flex;align-items:center;gap:.8rem;padding:.65rem 0;border-bottom:1px solid rgba(255,255,255,.05);}
.att-row-ui:last-child{border-bottom:none;}
.att-name-block{flex:1;}
.att-name-block .name{font-weight:500;font-size:.9rem;}
.att-toggle{display:flex;gap:.4rem;}
.att-btn{
  padding:.35rem .9rem;border-radius:7px;border:1.5px solid;cursor:pointer;
  font-size:.82rem;font-weight:500;font-family:'Noto Sans KR',sans-serif;
  transition:all .18s;background:transparent;
}
/* 출석 - 미선택 */
.att-o{border-color:rgba(46,204,113,.4);color:rgba(46,204,113,.55);}
/* 출석 - 선택됨 */
.att-o.on{
  background:#27ae60;border-color:#27ae60;color:#fff;
  box-shadow:0 2px 8px rgba(39,174,96,.45);
  font-weight:700;
}
/* 결석 - 미선택 */
.att-x{border-color:rgba(231,76,60,.4);color:rgba(231,76,60,.55);}
/* 결석 - 선택됨 */
.att-x.on{
  background:#c0392b;border-color:#c0392b;color:#fff;
  box-shadow:0 2px 8px rgba(192,57,43,.45);
  font-weight:700;
}
.self-note{font-size:.7rem;color:var(--gold);opacity:.75;margin-left:.35rem;}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;margin-bottom:1rem;}
.stat-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:.85rem .4rem;text-align:center;}
.stat-val{font-size:1.7rem;font-weight:700;color:var(--gold);}
.stat-lbl{font-size:.68rem;color:var(--cream2);opacity:.65;margin-top:.15rem;}

/* MEMBER */
.mem-item{display:flex;align-items:center;gap:.7rem;padding:.65rem 0;border-bottom:1px solid rgba(255,255,255,.05);}
.mem-item:last-child{border-bottom:none;}
.mem-info{flex:1;}
.mem-sub{font-size:.72rem;color:var(--cream2);opacity:.6;margin-top:.15rem;}

/* ACT EDIT */
.act-edit-item{display:flex;align-items:center;gap:.4rem;padding:.42rem 0;border-bottom:1px solid rgba(255,255,255,.05);}
.act-edit-item input{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:.38rem .7rem;color:var(--cream);font-family:'Noto Sans KR',sans-serif;font-size:.83rem;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--navy2);border:1px solid var(--border);border-radius:16px;padding:1.5rem;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;}
.modal-title{font-family:'Noto Serif KR',serif;color:var(--gold);font-size:1.05rem;margin-bottom:1.2rem;}
.modal-actions{display:flex;gap:.7rem;margin-top:1.2rem;}
.modal-actions .btn{flex:1;}

/* TOAST */
.toast{position:fixed;bottom:5.2rem;left:50%;transform:translateX(-50%);background:var(--navy3);border:1px solid var(--border);color:var(--cream);padding:.65rem 1.4rem;border-radius:9px;font-size:.83rem;z-index:400;animation:fadeUp .25s ease;white-space:nowrap;pointer-events:none;}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* 즐겨찾기 별표 버튼 */
.star-btn{
  background:none;border:none;cursor:pointer;
  font-size:1rem;line-height:1;padding:.1rem .2rem;
  color:rgba(255,255,255,.25);transition:color .15s;flex-shrink:0;
}
.star-btn.on{color:var(--gold);}
.star-btn:hover{color:var(--gold2);}
/* 즐겨찾기 섹션 헤더 */
.fav-head{
  font-size:.75rem;color:var(--gold);letter-spacing:.06em;
  padding:.35rem 0;margin-bottom:.2rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.4rem;
}
.text-muted{color:var(--cream2);opacity:.6;font-size:.8rem;}
</style>
</head>
<body>

<!-- ════ 로딩 화면 ════ -->
<div id="loading-screen">
  <div class="login-cross">✝</div>
  <div class="login-title">레지오 마리애</div>
  <div class="spinner"></div>
  <div class="load-msg" id="loading-msg">서버에 연결 중...</div>
</div>

<!-- ════ 로그인 화면 ════ -->
<div id="login-screen" style="display:none;">
  <div class="login-cross">✝</div>
  <div class="login-title">레지오 마리애</div>
  <div class="login-sub">주 회합 활동보고 시스템</div>
  <div class="login-card">
    <div class="fg"><label>아이디</label><input type="text" id="li" placeholder="아이디" autocomplete="username"></div>
    <div class="fg"><label>비밀번호</label><input type="password" id="lp" placeholder="비밀번호" autocomplete="current-password"></div>
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1.1rem;">
      <input type="checkbox" id="rememberChk" style="width:16px;height:16px;accent-color:var(--gold);cursor:pointer;">
      <label for="rememberChk" style="font-size:.82rem;color:var(--cream2);cursor:pointer;">아이디 저장</label>
    </div>
    <div id="lerr" class="err" style="margin-bottom:.8rem;"></div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- ════ 앱 ════ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">✝ 레지오 마리애</div>
    <div style="display:flex;align-items:center;gap:.6rem;">
      <div class="topbar-user" id="topbar-user"></div>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="content" id="content"></div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<!-- ════ Firebase SDK ════ -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ══════════════════════════════════════════════════
   ★ FIREBASE 설정 ★
   아래 값을 본인의 Firebase 프로젝트 설정으로 교체하세요.
   Firebase Console → 프로젝트 설정 → 내 앱 → SDK 설정 및 구성

   [Firebase 설정 방법]

      {

   5. 프로젝트 설정 → 앱 추가(웹) → 아래 config 복사
══════════════════════════════════════════════════ */

  authDomain:        "legio-99db6.firebaseapp.com",
  databaseURL:       "https://legio-99db6-default-rtdb.firebaseio.com",
  projectId:         "legio-99db6",

};

/* ════ Firebase 초기화 ════ */
firebase.initializeApp(firebaseConfig);
var fdb = firebase.database();
var ROOT = 'legio'; // 데이터 저장 루트 경로
var fref = function(p){ return fdb.ref(ROOT + (p ? '/' + p : '')); };

/* ════ 메모리 캐시 ════

  {id:'c2',name:'본당 사목자 지시 사항',items:[

    {id:'i2_4',name:'성시간 참례'},{id:'i2_5',name:'성모, 성요셉 신심미사'},{id:'i2_6',name:'성지 순례'}]},
  {id:'c3',name:'입교 권면',items:[
    {id:'i3_1',name:'외인 입교 권면'},{id:'i3_2',name:'교리 중단자 재권면'},{id:'i3_3',name:'개종 권면'},
    {id:'i3_4',name:'가두 선교'},{id:'i3_5',name:'방문 선교'}]},
  {id:'c4',name:'예비신자 돌봄',items:[
    {id:'i4_1',name:'교리반 인도 예비신자 돌봄'},{id:'i4_2',name:'통신교리자 돌봄'},{id:'i4_3',name:'교리반 봉사 또는 협조'}]},
  {id:'c5',name:'교우 돌봄',items:[
    {id:'i5_1',name:'새영세자 돌봄'},{id:'i5_2',name:'전입교우 돌봄'},{id:'i5_3',name:'냉담교우 돌봄'},
    {id:'i5_4',name:'조당(혼인장애) 안내'},{id:'i5_5',name:'성사 권면'},{id:'i5_6',name:'유아세례 권면'},

      var c=yr[sw][iid];
      if(c>0) arr.push({mid:mid,year:year,week:week,iid:iid,count:c});
    }
  }
  return arr;

function getMonthReports(year,weeks){
  var arr=[],sy=String(year);

    for(var wi=0;wi<weeks.length;wi++){

      if(!yr[sw]) continue;
      for(var iid in yr[sw]){
        var c=yr[sw][iid];
        if(c>0) arr.push({mid:mid,year:year,week:weeks[wi],iid:iid,count:c});
      }
    }
  }
  return arr;
}

/* ════ 주차 유틸 ════ */
function getWeekNum(d){
  var jan1=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
}
function getWeekInfo(d){
  var dt=d?new Date(d):new Date();
  return {year:dt.getFullYear(),week:getWeekNum(dt),month:dt.getMonth()+1};
}
function getLastWeek(y){return getWeekNum(new Date(y,11,28));}
function prevW(y,w){return w===1?{year:y-1,week:getLastWeek(y-1)}:{year:y,week:w-1};}
function nextW(y,w){var l=getLastWeek(y);return w>=l?{year:y+1,week:1}:{year:y,week:w+1};}
function getWeekRange(y,w){
  var jan1=new Date(y,0,1);
  var startDoy=(w-1)*7-jan1.getDay()+1;
  var d=new Date(y,0,startDoy);
  var day=d.getDay();
  var toMon=(day===0)?1:(1-day);
  var monday=new Date(d.getTime()+toMon*86400000);
  var sunday=new Date(monday.getTime()+6*86400000);
  return {monday:monday,sunday:sunday};
}
function fmtMD(d){return (d.getMonth()+1)+'/'+(d.getDate());}
function weekLabel(y,w){
  var yy=String(y).slice(2);
  var r=getWeekRange(y,w);
  return yy+'년 '+w+'주차 ('+fmtMD(r.monday)+'~'+fmtMD(r.sunday)+')';
}

/* 창단일로부터 선택 주차까지 몇 주차인지 계산 */
function foundingWeekLabel(y,w){
  var fd=CACHE.settings&&CACHE.settings.foundingDate;
  if(!fd) return '';
  /* 창단일이 속한 주의 월요일 기준 */
  var fdDate=new Date(fd);
  var fdDay=fdDate.getDay();
  var toMon=(fdDay===0)?-6:(1-fdDay);
  var fdMonday=new Date(fdDate.getTime()+toMon*86400000);
  /* 선택 주차의 월요일 */
  var range=getWeekRange(y,w);
  var selMonday=range.monday;
  /* 주 차이 계산 */
  var diff=Math.round((selMonday-fdMonday)/(7*86400000));
  if(diff<0) return '';
  return '창단 '+(diff+1)+'주차';
}
function getMonthWeeks(y,m){
  var s={},days=new Date(y,m,0).getDate(),arr=[];
  for(var d=1;d<=days;d++) s[getWeekNum(new Date(y,m-1,d))]=1;
  for(var k in s) arr.push(parseInt(k));
  return arr.sort(function(a,b){return a-b;});
}
/* 회합 요일 기준으로 해당 월에 속하는 주차만 반환
   meetingDay: 0=일,1=월,2=화,3=수,4=목,5=금,6=토 (JS Date 기준)
   해당 월 안에 회합 요일 날짜가 있는 주차만 포함 */
function getWeeksForMonth(y,m,meetingDay){
  var seen={},arr=[],days=new Date(y,m,0).getDate();
  for(var d=1;d<=days;d++){
    var date=new Date(y,m-1,d);
    if(date.getDay()===meetingDay){
      var w=getWeekNum(date);
      if(!seen[w]){seen[w]=1;arr.push(w);}
    }
  }
  return arr.sort(function(a,b){return a-b;});
}

/* ════ 유틸 ════ */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hlText(text,q){
  if(!q)return esc(text);
  var result='',t=String(text),lq=q.toLowerCase(),lt=t.toLowerCase(),i=0;
  while(i<t.length){
    var fi=lt.indexOf(lq,i);
    if(fi===-1){result+=esc(t.slice(i));break;}
    result+=esc(t.slice(i,fi))+'<span class="hl">'+esc(t.slice(fi,fi+q.length))+'</span>';
    i=fi+q.length;
  }
  return result;
}

  if(q) h+='<div class="s-count">검색 결과: '+totalMatch+'개</div>';
  else if(S.editing){
    h+='<div class="text-muted" style="margin-bottom:.8rem;font-size:.78rem;">✏️ 편집 중 — 수정 후 저장 버튼을 눌러주세요.</div>';
  } else {
    h+='<div class="text-muted" style="margin-bottom:.8rem;font-size:.78rem;">※ 입력 버튼을 눌러 활동을 입력하세요. ★ 별표로 즐겨찾기 설정 가능.</div>';
  }

  if(q&&totalMatch===0){
    h+='<div class="no-result">🔍 "'+esc(q)+'"에 해당하는 활동이 없습니다.</div>';
    return h;
  }

  /* ── 즐겨찾기 섹션 (검색 중이 아닐 때만) ── */
  if(!q && favIds.length>0){
    h+='<div class="card">'
      +'<div class="fav-head">★ 즐겨찾기</div>';
    /* iid → item 매핑으로 즐겨찾기 항목 나열 */
    for(var fi=0;fi<favIds.length;fi++){
      var iid=favIds[fi];
      var foundItem=null;
      for(var ci=0;ci<acts.length;ci++){
        for(var ii=0;ii<acts[ci].items.length;ii++){
          if(acts[ci].items[ii].id===iid){foundItem=acts[ci].items[ii];break;}
        }
        if(foundItem) break;
      }
      if(!foundItem) continue;
      h+=_buildActItem(foundItem, true);
    }
    h+='</div>';
  }

  /* ── 전체 카테고리 목록 ── */
  for(var ci=0;ci<acts.length;ci++){
    var cat=acts[ci];
    var catM=cat.name.toLowerCase().indexOf(qlc)!==-1;
    /* 검색 필터 + 즐겨찾기 제외 */
    var matchItems=[];
    for(var ii=0;ii<cat.items.length;ii++){
      var it=cat.items[ii];
      var nameM=catM||it.name.toLowerCase().indexOf(qlc)!==-1;
      if(!nameM) continue;
      /* 즐겨찾기 항목은 카테고리에서 숨김 (검색 중일 때는 유지) */
      if(!q && favMap[it.id]) continue;
      matchItems.push(it);
    }
    /* 검색 중이고 해당 카테고리에 매칭 없으면 skip */
    if(q && !matchItems.length) continue;

    h+='<div class="card"><div class="card-head">'+hlText(cat.name,q)+'</div>';
    if(matchItems.length===0){
      /* 즐겨찾기로 모두 이동 → 카테고리만 표시, 빈 상태 안내 */
      h+='<div class="text-muted" style="font-size:.78rem;padding:.3rem 0;">— 모든 항목이 즐겨찾기로 이동되었습니다.</div>';
    } else {
      for(var mi=0;mi<matchItems.length;mi++){
        h+=_buildActItem(matchItems[mi], false);
      }
    }
    h+='</div>';
  }
  return h;
}

function _buildActItem(item, isFavSection){
  var mid=S.user.id;
  var favMap=CACHE.favorites[mid]||{};
  var isFav=!!favMap[item.id];
  var val=S.editing
    ?(S.pendingRpts[item.id]!==undefined?S.pendingRpts[item.id]:getMyCount(item.id))
    :getMyCount(item.id);

  var h='<div class="act-item">'
    /* 별표 버튼 */
    +'<button class="star-btn'+(isFav?' on':'')+'" onclick="toggleFav(\''+item.id+'\')" title="즐겨찾기">'
    +(isFav?'★':'☆')+'</button>'
    +'<div class="act-item-name">'+esc(item.name)+'</div>';

  if(S.editing){
    h+='<input type="number" class="num-inp" min="0" max="999" value="'+(val||'')+'"'
      +' onchange="setPending(\''+item.id+'\',this.value)"'
      +' oninput="if(parseInt(this.value)<0||this.value===\'-\')this.value=0">';
  } else {
    h+='<span class="num-display">'+(val||'—')+'</span>';
  }
  h+='</div>';
  return h;
}

function toggleFav(iid){
  var mid=S.user.id;
  if(!CACHE.favorites[mid]) CACHE.favorites[mid]={};
  var isOn=!!CACHE.favorites[mid][iid];
  FB.setFavorite(mid,iid,!isOn)
    .catch(function(e){toast('⚠️ 저장 실패: '+e.message);});
  /* 로컬 캐시 즉시 반영 */
  if(isOn) delete CACHE.favorites[mid][iid];
  else CACHE.favorites[mid][iid]=true;
  _renderActResults();
}

function shiftW(d){
  /* 편집 중 주차 이동 시 경고 */
  if(S.editing && S.view==='input'){
    var dir=d;
    openModal(
      '<div class="modal-title" style="color:#e74c3c;">⚠️ 저장하지 않은 변경사항</div>'
      +'<p style="font-size:.88rem;color:var(--cream2);margin-bottom:1.2rem;line-height:1.6;">'
      +'입력한 내용이 아직 저장되지 않았습니다.<br>저장하고 이동하시겠습니까?</p>'
      +'<div style="display:flex;flex-direction:column;gap:.6rem;">'
      +'<button class="btn btn-primary btn-full" onclick="saveAndShiftW('+dir+')">저장하고 이동</button>'
      +'<button class="btn btn-red btn-full" onclick="discardAndShiftW('+dir+')">저장 안 하고 이동</button>'
      +'<button class="btn btn-ghost btn-full" onclick="closeModalForce()">취소 (계속 입력)</button>'
      +'</div>'
    );
    return;
  }
  _doShiftW(d);
}
function _doShiftW(d){
  if(d<0){var p=prevW(S.selYear,S.selWeek);S.selYear=p.year;S.selWeek=p.week;}
  else{var n=nextW(S.selYear,S.selWeek);S.selYear=n.year;S.selWeek=n.week;}
  renderView();
}
function saveAndShiftW(d){
  closeModalForce();
  _flushPending(function(){
    S.editing=false; S.pendingRpts={};
    _doShiftW(d);
    toast('✅ 저장되었습니다');
  });
}
function discardAndShiftW(d){
  closeModalForce();
  S.editing=false; S.pendingRpts={};
  _doShiftW(d);
  toast('🗑️ 변경사항이 취소되었습니다');
}
function shiftM(d){
  S.selMonth+=d;
  if(S.selMonth<1){S.selMonth=12;S.selYear2--;}
  if(S.selMonth>12){S.selMonth=1;S.selYear2++;}
  renderView();
}

/* ════ 편집 모드 함수들 ════ */
function startEdit(){
  /* 현재 저장된 값을 pending 버퍼에 초기화 */
  S.pendingRpts={};
  S.editing=true;
  renderView();
  /* 검색창 포커스 유지 */
  setTimeout(function(){
    var inp=document.getElementById('searchInput');
    if(inp&&S.searchQ) inp.focus();
  },50);
}

function setPending(iid,val){
  var count=Math.max(0,parseInt(val)||0);
  S.pendingRpts[iid]=count;
}

function _flushPending(callback){
  var keys=Object.keys(S.pendingRpts);
  if(!keys.length){ if(callback) callback(); return; }
  var done=0,total=keys.length;
  for(var i=0;i<keys.length;i++){
    (function(iid){
      FB.setReport(S.user.id,S.selYear,S.selWeek,iid,S.pendingRpts[iid])
        .then(function(){ done++; if(done>=total&&callback) callback(); })
        .catch(function(e){ toast('⚠️ 저장 실패: '+e.message); done++; if(done>=total&&callback) callback(); });
    })(keys[i]);
  }
}

function saveEdit(){
  _flushPending(function(){
    S.editing=false; S.pendingRpts={};
    renderView();
    toast('✅ 저장되었습니다');
  });
}

function cancelEdit(){
  S.editing=false; S.pendingRpts={};
  renderView();
  toast('🗑️ 입력이 취소되었습니다');
}

}

  h+='</tr></thead><tbody>';

  for(var ci=0;ci<acts.length;ci++){
    var cat=acts[ci];
    var matched=cat.items.filter(function(it){return mems.some(function(m){return gc(m.id,it.id)>0;});});
    if(!matched.length) continue;
    /* 카테고리 합계 계산 */
    var catTot=0;
    for(var mi3=0;mi3<matched.length;mi3++){
      for(var mi=0;mi<mems.length;mi++) catTot+=gc(mems[mi].id,matched[mi3].id);
    }
    h+='<tr class="cat-row">'
      +'<td class="left-td stk" style="white-space:normal">'+esc(cat.name)+'</td>'
      +'<td class="tot cat-tot">'+(catTot||'')+'</td>'
      +new Array(mems.length+1).join('<td></td>')
      +'</tr>';
    for(var mi2=0;mi2<matched.length;mi2++){
      var it=matched[mi2],tot=0,cells='';
      for(var mi=0;mi<mems.length;mi++){var c=gc(mems[mi].id,it.id);tot+=c;cells+='<td>'+(c||'')+'</td>';}
      h+='<tr><td class="left-td stk" style="white-space:normal">'+esc(it.name)+'</td>'
        +'<td class="tot">'+(tot||'')+'</td>'+cells+'</tr>';
    }
  }
  /* 활동 합계 */
  var mTots=[],grand=0;
  for(var mi=0;mi<mems.length;mi++){
    var t=0;for(var ri=0;ri<mRpts.length;ri++){if(mRpts[ri].mid===mems[mi].id)t+=mRpts[ri].count;}
    mTots.push(t);grand+=t;
  }
  h+='<tr><td class="tot left-td stk" style="white-space:nowrap">활동 합계</td>'
    +'<td class="tot">'+(grand||'')+'</td>';
  for(var i=0;i<mTots.length;i++) h+='<td class="tot">'+(mTots[i]||'')+'</td>';
  h+='</tr>';
  /* 출석 합계 - 간부/단원 구분 */
  var OFFICER_ROLES=['단장','부단장','서기','회계'];
  var offAtt=0,offTotal=0,memAtt=0,memTotal=0;
  for(var mi=0;mi<mems.length;mi++){
    var isOfficer=OFFICER_ROLES.indexOf(mems[mi].role)!==-1;
    var pn=0;
    for(var wi=0;wi<weeks.length;wi++){var a=getAttObj(mems[mi].id,S.selYear2,weeks[wi]);if(a&&a.present===true)pn++;}
    if(isOfficer){offAtt+=pn;offTotal+=weeks.length;}
    else{memAtt+=pn;memTotal+=weeks.length;}
  }
  var attSummary=offTotal>0&&memTotal>0
    ?offAtt+'/'+memAtt
    :offTotal>0?'간부: '+offAtt:'단원: '+memAtt;
  h+='<tr class="att-sum-row"><td class="tot left-td stk" style="white-space:nowrap">출석 (간부/단원)</td>'
    +'<td class="tot">'+attSummary+'</td>';
  for(var mi=0;mi<mems.length;mi++){
    var pn=0;
    for(var wi=0;wi<weeks.length;wi++){var a=getAttObj(mems[mi].id,S.selYear2,weeks[wi]);if(a&&a.present===true)pn++;}
    h+='<td class="tot">'+pn+'/'+weeks.length+'</td>';
  }
  h+='</tr></tbody></table></div>';
  return h;
}

function setAtt(mid,present){
  var isSelf=S.user&&S.user.id===mid;

  FB.setAttendance(mid,S.selYear,S.selWeek,present)
    .catch(function(e){toast('⚠️ 저장 실패: '+e.message);});
  renderView();
  toast(present?'✅ 출석 완료':'❌ 결석 처리');
}

/* ════ 창단일 저장 (단장만) ════ */
function saveFoundingDate(){
  var inp=document.getElementById('fdInput');
  if(!inp||!inp.value){toast('⚠️ 날짜를 선택해 주세요.');return;}
  var val=inp.value; // 'YYYY-MM-DD'
  FB.setSetting('foundingDate',val)
    .catch(function(e){toast('⚠️ 저장 실패: '+e.message);});
  CACHE.settings.foundingDate=val;
  toast('✅ 창단일이 저장되었습니다');
  renderView();
}

function changePW(){
  var cur=document.getElementById('cpw0').value;
  var nw=document.getElementById('cpw1').value;
  var cf=document.getElementById('cpw2').value;
  var el=document.getElementById('cpw-err');
  el.style.color='#e74c3c';
  if(S.user.password!==cur){el.textContent='현재 비밀번호가 올바르지 않습니다.';return;}
  if(!nw){el.textContent='새 비밀번호를 입력하세요.';return;}
  if(nw!==cf){el.textContent='새 비밀번호가 일치하지 않습니다.';return;}
  var m=CACHE.members[S.user.id];
  if(!m) return;
  m.password=nw;S.user.password=nw;
  FB.setMember(m).catch(function(e){toast('⚠️ 저장 실패: '+e.message);});
  el.style.color='#2ecc71';el.textContent='✅ 변경되었습니다.';
  setTimeout(function(){try{document.getElementById('cpw-err').textContent='';}catch(e){}},3000);
}

function delMem(mid){
  if(!confirm('정말 이 단원을 삭제하시겠습니까?')) return;
  FB.delMember(mid).catch(function(e){toast('⚠️ 저장 실패: '+e.message);});
  toast('🗑️ 삭제되었습니다');
  renderView();
}

function addMem(){
  var name=(document.getElementById('mn').value||'').trim();
  var uname=(document.getElementById('mu').value||'').trim();
  var pw=document.getElementById('mp').value||'';
  var role=document.getElementById('mr').value;
  var el=document.getElementById('merr');
  if(!name||!uname||!pw){el.textContent='모든 항목을 입력하세요.';return;}
  for(var id in CACHE.members){if(CACHE.members[id].username===uname){el.textContent='이미 사용 중인 아이디입니다.';return;}}
  var newM={id:'m'+Date.now(),username:uname,password:pw,name:name,role:role};
  FB.setMember(newM).catch(function(e){toast('⚠️ 저장 실패: '+e.message);});
  closeModalForce();toast('✅ 단원이 추가되었습니다');renderView();
}

function modalEditMem(mid){
  var m=CACHE.members[mid];if(!m)return;
  openModal('<div class="modal-title">단원 수정</div>'
    +'<div class="fg"><label>이름</label><input type="text" id="en" value="'+esc(m.name)+'"></div>'
    +'<div class="fg"><label>아이디</label><input type="text" id="eu" value="'+esc(m.username)+'"'+(m.role==='admin'?' readonly':'')+'></div>'
    +'<div class="fg"><label>비밀번호 (변경 시만 입력)</label><input type="password" id="ep" placeholder="변경하지 않으면 빈칸"></div>'
    +(m.role!=='admin'
      ?'<div class="fg"><label>역할</label><select id="er">'
        +'<option value="단장"'+(m.role==='단장'?' selected':'')+'>단장</option>'
        +'<option value="부단장"'+(m.role==='부단장'?' selected':'')+'>부단장</option>'
        +'<option value="서기"'+(m.role==='서기'?' selected':'')+'>서기</option>'
        +'<option value="회계"'+(m.role==='회계'?' selected':'')+'>회계</option>'
        +'<option value="평단원"'+(m.role==='평단원'?' selected':'')+'>평단원</option>'
        +'</select></div>':'')
    +'<div id="eerr" class="err"></div>'
    +'<div class="modal-actions">'
    +'<button class="btn btn-ghost" onclick="closeModalForce()">취소</button>'
    +'<button class="btn btn-primary" onclick="saveMem(\''+mid+'\')">저장</button></div>');
}
function saveMem(mid){
  var m=CACHE.members[mid];if(!m)return;
  var name=(document.getElementById('en').value||'').trim();
  var uname=(document.getElementById('eu').value||'').trim();
  var pw=document.getElementById('ep').value||'';
  var roleEl=document.getElementById('er');
  var el=document.getElementById('eerr');
  if(!name||!uname){el.textContent='이름과 아이디를 입력하세요.';return;}
  if(uname!==m.username){
    for(var id in CACHE.members){if(CACHE.members[id].username===uname){el.textContent='이미 사용 중인 아이디입니다.';return;}}
  }
  var updated={id:mid,username:uname,name:name,role:roleEl?roleEl.value:m.role,password:pw?pw:m.password};
  FB.setMember(updated).catch(function(e){toast('⚠️ 저장 실패: '+e.message);});
  if(S.user.id===mid){
    S.user=updated;
    document.getElementById('topbar-user').textContent=updated.name+' ('+(updated.role==='admin'?'관리자':updated.role)+')';
  }
  closeModalForce();toast('✅ 수정되었습니다');renderView();
}

function modalActs(){
  var acts=CACHE.activities||[];
  var h='<div class="modal-title">활동 목록 편집</div>';
  for(var ci=0;ci<acts.length;ci++){
    var cat=acts[ci];
    h+='<div style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border);">'
      +'<div style="display:flex;gap:.4rem;margin-bottom:.6rem;">'
      +'<input type="text" id="cn'+ci+'" value="'+esc(cat.name)+'" style="flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:.38rem .7rem;color:var(--cream);font-family:inherit;font-size:.82rem;font-weight:600;">'
      +'<button class="btn btn-red btn-sm" onclick="actDelCat('+ci+')">삭제</button></div>';
    for(var ii=0;ii<cat.items.length;ii++){
      h+='<div class="act-edit-item">'
        +'<input type="text" id="in'+ci+'_'+ii+'" value="'+esc(cat.items[ii].name)+'">'
        +'<button class="btn btn-red btn-sm" onclick="actDelItem('+ci+','+ii+')">✕</button></div>';
    }
    h+='<button class="btn btn-ghost btn-sm btn-full" style="margin-top:.5rem" onclick="actAddItem('+ci+')">＋ 항목 추가</button></div>';
  }
  h+='<button class="btn btn-green btn-full" style="margin-bottom:.7rem" onclick="actAddCat()">＋ 카테고리 추가</button>'
    +'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModalForce()">취소</button>'
    +'<button class="btn btn-primary" onclick="actSave()">저장</button></div>';
  openModal(h);
}
function actGather(){
  /* 깊은 복사 후 DOM 값으로 덮어쓰기 */
  var acts=JSON.parse(JSON.stringify(CACHE.activities||[]));
  for(var ci=0;ci<acts.length;ci++){
    var cel=document.getElementById('cn'+ci);if(cel)acts[ci].name=cel.value;
    for(var ii=0;ii<acts[ci].items.length;ii++){
      var iel=document.getElementById('in'+ci+'_'+ii);if(iel)acts[ci].items[ii].name=iel.value;
    }
  }
  return acts;
}
function actAddCat(){var a=actGather();a.push({id:'c'+Date.now(),name:'새 카테고리',items:[]});CACHE.activities=a;modalActs();}
function actAddItem(ci){var a=actGather();a[ci].items.push({id:'i'+Date.now(),name:'새 항목'});CACHE.activities=a;modalActs();}
function actDelCat(ci){if(!confirm('카테고리를 삭제하시겠습니까?'))return;var a=actGather();a.splice(ci,1);CACHE.activities=a;modalActs();}
function actDelItem(ci,ii){var a=actGather();a[ci].items.splice(ii,1);CACHE.activities=a;modalActs();}
function actSave(){
  FB.setActivities(actGather()).catch(function(e){toast('⚠️ 저장 실패: '+e.message);});
  closeModalForce();toast('✅ 활동 목록이 저장되었습니다');renderView();
}

/* ════ Firebase 리스너 & 초기화 ════ */
var _initialized=false;

function setupListeners(){
  var loaded={m:false,a:false,r:false,att:false,s:false,f:false};

  function checkReady(){
    if(loaded.m&&loaded.a&&loaded.r&&loaded.att&&loaded.s&&loaded.f&&!_initialized){
      _initialized=true;
      /* 초기 데이터가 없으면 기본값 입력 */
      if(Object.keys(CACHE.members).length===0){
        FB.setMember({id:'m0',username:'admin',password:'legio2024',name:'관리자',role:'admin'});
      }
      if(!CACHE.activities||CACHE.activities.length===0){
        FB.setActivities(DEFAULT_ACTS);
      }
      /* 로딩 화면 → 로그인 화면 */
      document.getElementById('loading-screen').style.display='none';
      document.getElementById('login-screen').style.display='flex';
      loadSavedId();
    }
  }

  /* 단원 실시간 동기화 */
  fref('members').on('value',function(snap){
    CACHE.members=snap.val()||{};
    loaded.m=true;checkReady();
    if(S.user&&noModal()) renderView();
  },function(err){
    document.getElementById('loading-msg').textContent='연결 실패: '+err.message;
  });

  /* 활동 목록 실시간 동기화 */
  fref('activities').on('value',function(snap){
    var v=snap.val();
    try{CACHE.activities=v?JSON.parse(v):[];}catch(e){CACHE.activities=[];}
    loaded.a=true;checkReady();
    if(S.user&&noModal()) renderView();
  });

  /* 활동 보고 실시간 동기화 */
  fref('reports').on('value',function(snap){
    CACHE.reports=snap.val()||{};
    loaded.r=true;checkReady();
    if(S.user&&noModal()){
      if(S.view==='input') _renderActResults();
      else renderView();
    }
  });

  /* 출석 실시간 동기화 */
  fref('attendance').on('value',function(snap){
    CACHE.attendance=snap.val()||{};
    loaded.att=true;checkReady();
    if(S.user&&noModal()&&(S.view==='att'||S.view==='monthly')) renderView();
  });

  /* 설정 실시간 동기화 (회합 요일 등) */
  fref('settings').on('value',function(snap){
    CACHE.settings=snap.val()||{};
    if(CACHE.settings.meetingDay!==undefined) S.meetingDay=CACHE.settings.meetingDay;
    loaded.s=true;checkReady();
    if(S.user&&noModal()&&(S.view==='monthly'||S.view==='att')) renderView();
  });

  /* 즐겨찾기 실시간 동기화 */
  fref('favorites').on('value',function(snap){
    CACHE.favorites=snap.val()||{};
    loaded.f=true;checkReady();
    if(S.user&&noModal()&&S.view==='input') renderView();
  });
}

/* ════ 앱 시작 ════ */
function setupApp(){
  try{
    setupListeners();
  }catch(e){
    document.getElementById('loading-msg').textContent='초기화 오류: '+e.message+' (Firebase Config를 확인하세요)';
  }
}

setupApp();
</script>
